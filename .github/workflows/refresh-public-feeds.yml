name: Refresh public feeds

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

concurrency:
  group: refresh-public-feeds
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Refresh public no-key feeds
        run: |
          python scripts/fetch_usgs_earthquakes.py
          python scripts/fetch_noaa_tide_stations.py
          python scripts/fetch_nws_stations.py
          python scripts/fetch_usgs_active_stream_sites.py
      - name: Rebuild release metadata
        run: |
          python scripts/build_catalog.py
          python scripts/build_release_manifest.py
          python scripts/build_coverage_report.py
      - name: Validate refreshed release
        run: |
          python -m compileall -q api scripts
          python -m unittest tests/test_api.py
          python scripts/validate_data_ci.py
          python scripts/validate_capitals.py
          git diff --check
      - name: Commit refreshed release
        run: |
          if git diff --quiet; then
            echo "No public-feed changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/normalized data/raw metadata
          git commit -m "Refresh public feeds [skip ci]"
          git push
