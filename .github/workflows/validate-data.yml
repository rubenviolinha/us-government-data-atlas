name: Validate data

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m compileall -q api scripts
      - run: python scripts/export_csv.py states.json /tmp/states.csv
      - run: python -m unittest tests/test_api.py
      - run: python scripts/build_release_manifest.py
      - run: python scripts/validate_data.py
      - run: python scripts/validate_capitals.py
