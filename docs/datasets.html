<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dataset catalog · US Government Data Atlas</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <header class="topbar"><div class="shell nav"><a class="wordmark" href="./">US Government Data Atlas</a><nav><a href="./">API reference</a><a href="openapi.json">OpenAPI</a><a href="https://github.com/rubenviolinha/us-government-data-atlas">GitHub</a></nav></div></header>
  <main class="shell catalog-page">
    <p class="kicker">Dataset catalog</p><h1>Find a normalized release</h1><p class="intro-copy">Search the checked-in files by filename, field, or source. The index is generated from <code>metadata/catalog.json</code>.</p>
    <label class="search-label" for="search">Search datasets</label><input id="search" class="search" type="search" placeholder="e.g. governors, GEOID, NOAA">
    <p id="result-count" class="muted"></p><div id="results" class="dataset-list" aria-live="polite"></div>
  </main>
  <script>
    const search = document.querySelector('#search'); const results = document.querySelector('#results'); const count = document.querySelector('#result-count');
    fetch('catalog.json').then(response => response.json()).then(catalog => { const entries = catalog.entries || []; function render() { const term = search.value.trim().toLowerCase(); const matches = entries.filter(entry => !term || JSON.stringify(entry).toLowerCase().includes(term)); count.textContent = `${matches.length.toLocaleString()} of ${entries.length.toLocaleString()} dataset files`; results.innerHTML = matches.slice(0, 200).map(entry => `<article class="dataset-card"><h2><code>${entry.file.replace('data/normalized/','')}</code></h2><p class="muted">${Number(entry.records || 0).toLocaleString()} records · ${entry.format || 'JSON'}</p><p><strong>Fields:</strong> ${(entry.fields_sample || []).slice(0, 12).map(field => `<code>${field}</code>`).join(' ') || '—'}</p><p><strong>Source:</strong> ${(entry.source_urls_sample || []).slice(0, 2).map(url => `<a href="${url}">${url}</a>`).join(' · ') || '—'}</p></article>`).join('') || '<p>No matching datasets.</p>'; } search.addEventListener('input', render); render(); });
  </script>
</body>
</html>
